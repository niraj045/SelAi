# Test Configuration
spring.application.name=orchestration-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:orchestrationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# External service URLs are never called by the context-load test.
ai.engine.base-url=http://localhost:5000
execution.service.base-url=http://localhost:8083
reporting.service.base-url=http://localhost:8084

logging.level.root=WARN
logging.level.com.ns.selai.orchestration=INFO
