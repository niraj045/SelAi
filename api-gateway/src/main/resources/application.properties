# Server Configuration
server.port=8080
spring.application.name=api-gateway

# Downstream Service URLs
services.test-management.url=http://localhost:8081
services.orchestration.url=http://localhost:8082
services.execution.url=http://localhost:8083
services.reporting.url=http://localhost:8084

# Gateway Security
gateway.auth.enabled=false
gateway.auth.token=dev-token
gateway.auth.public-paths=/actuator,/api/health

# CORS
gateway.cors.allowed-origins=*

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.root=INFO
