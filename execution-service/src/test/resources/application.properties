# Test Configuration
spring.application.name=execution-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:executiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

execution.browser.headless=true
execution.screenshot.path=target/test-screenshots
orchestration.service.url=http://localhost:8082

logging.level.root=WARN
logging.level.com.ns.selai.execution=INFO
